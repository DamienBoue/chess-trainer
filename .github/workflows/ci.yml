name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  # The domain code shared by the app (src/): lint, types, tests.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage

  # The app (native/): types, including the shared code of src/, and the
  # web build published on GitHub Pages.
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # npm 11, as the lock file was written with (npm 10 resolves the
          # peer dependencies of react-native-worklets differently).
          node-version: 24
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: npm ci
      - run: npm ci
        working-directory: native
      - run: npx tsc --noEmit
        working-directory: native
      - run: npm run export:web
        working-directory: native
